# 온명 사이트를 GitHub Pages로 배포합니다.
# 빌드 과정이 없어서 web/ 폴더를 그대로 올리기만 하면 됩니다.
#
# 처음 한 번만 설정하세요:
#   저장소 → Settings → Pages → Build and deployment → Source 를 "GitHub Actions" 로 변경
#
# 그 뒤로는 main 에 푸시할 때마다 자동 배포됩니다.
# 다른 브랜치를 시험 삼아 올려보고 싶으면
#   Actions 탭 → "GitHub Pages 배포" → Run workflow 에서 브랜치를 골라 실행하세요.
name: GitHub Pages 배포

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포가 겹치면 나중 것만 남깁니다
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v4

      - name: Pages 설정 읽기
        uses: actions/configure-pages@v5

      - name: web 폴더 올리기
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - name: 배포
        id: deployment
        uses: actions/deploy-pages@v4
